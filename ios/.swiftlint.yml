included:
  - EmpiricalTracker
  - Packages

excluded:
  - .build
  - DerivedData

# Rules that align with the migration plan's quality bar
opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo            # Sprint stubs intentionally have TODO markers
  - missing_docs    # Sprint 0 — docs pass deferred to Sprint 12

line_length:
  warning: 120
  error: 160
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

nesting:
  type_level: 3
  statement_level: 5

identifier_name:
  min_length: 2
  excluded:
    - id
    - ok
    - g     # grams parameter name
